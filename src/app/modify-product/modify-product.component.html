<h2>{{ isEditMode ? 'Edit Product' : 'Add Product' }}</h2>
<form [formGroup]="productForm" >

  <div class="form-group">
    <label for="Product">Product</label>
    <input type="text" id="Product" formControlName="Product" />
  </div>

  <div class="form-group">
    <label for="Store">Store</label>
    <input type="text" id="Store" formControlName="Store" />
  </div>

  <div class="form-group">
    <label for="ProductID">ProductID</label>
    <input type="number" id="ProductID" formControlName="ProductID" />
  </div>

  <div class="form-group">
    <label for="Price">Price</label>
    <input type="number" id="Price" formControlName="Price" />
  </div>

  <div class="form-group">
    <label for="imageUrl">ImageUrl</label>
    <input type="text" id="imageUrl" formControlName="imageUrl" />
  </div>

  <button (click)="onSubmit()">{{ isEditMode ? 'Update Product' : 'Add Product' }}</button>
</form>
