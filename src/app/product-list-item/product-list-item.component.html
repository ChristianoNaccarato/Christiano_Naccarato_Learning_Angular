<div *ngIf="product" class="product-list">
  <h2>Product lists</h2>
  <p><strong>Product:</strong> {{ product.Product }}</p>
  <p><strong>Store:</strong> {{ product.Store }}</p>
  <p><strong>ProductID:</strong> {{ product.id }}</p>
  <p><strong>Price:</strong> {{ product.Price }}</p>
  <div>
    <strong>Image:</strong>
    <img
      [ngSrc]="product.imageUrl"
      [alt]="product.Product"
      width="100"
      height="100">
  </div>
</div>
